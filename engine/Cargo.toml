[package]
name = "shopping"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.2"
foldhash = "0.2.0"
hashbrown = "0.17.1"
memchr = "2.8.3"
memmap2 = "0.9.12"
parquet = { version = "60.1.0", default-features = false }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
